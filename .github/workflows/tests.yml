name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Check shell syntax
        run: |
          bash -n bin/xcl bin/xcl-tab bin/xcl-open
          sh -n install.sh
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
