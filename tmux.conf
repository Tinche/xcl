# xcl — a tabbed workspace for Claude Code / Codex.
#
# This runs on its own tmux socket ("xcl"), so none of it touches a personal
# tmux setup: your own `tmux` keeps stock defaults and never sees these
# options, these keybinds, or these sessions.

# If your distro lacks the tmux-256color terminfo entry (older Debian/RHEL),
# either install ncurses-term or change this to screen-256color.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# The shell is set by xcl at session-creation time, from the shell xcl was
# launched from, so shell tabs match your interactive shell.

set -g mouse on
set -g base-index 1            # Alt-1 is the first tab, not the second
setw -g pane-base-index 1
set -g renumber-windows on     # closing a tab closes the gap
# Once lazygit closes, normal tabs start at 1 again, even if tmux already
# renumbered them from the session's temporary base of 0.
# Use the hook's session explicitly: another repo may be active when git exits.
# Moving a window also unlinks it; only restore numbering once it is gone.
# Double hashes defer the marker lookup until tmux targets the hook's session.
set-hook -g window-unlinked { run-shell "tmux -S '#{socket_path}' list-panes -t '#{hook_session}:#{hook_window}' >/dev/null 2>&1 || tmux -S '#{socket_path}' if-shell -t '#{hook_session}:' -F '##{==:#{hook_window},##{@xcl_git}}' 'set-option -t #{hook_session} base-index 1 ; set-option -u -t #{hook_session} @xcl_git ; move-window -r -t #{hook_session}'" }
set -g escape-time 10          # don't swallow Alt- as an escape prefix
set -g history-limit 50000
set -g focus-events on
setw -g automatic-rename off   # xcl-tab enables title tracking for agent tabs only

# ---------------------------------------------------------------- tab bar
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5

# Colors come from the theme: a file in themes/ that sets the @xcl_* palette
# options below. These defaults are Catppuccin Mocha, so the file still works
# on its own; xcl then points @xcl_theme_file at the chosen theme and
# re-sources this file, and so does xcl-theme when you switch (prefix T).
set -g @xcl_bar_bg    "#181825"
set -g @xcl_bar_fg    "#a6adc8"
set -g @xcl_muted     "#6c7086"
set -g @xcl_accent_bg "#585b70"
set -g @xcl_accent_fg "#cdd6f4"
set -g @xcl_tab_bg    "#313244"
# Guarded: an empty path would make source-file try the working directory.
%if "#{@xcl_theme_file}"
source-file -F "#{@xcl_theme_file}"
%endif

# Style options take no formats, so -F bakes the palette in at load time.
# The format strings below expand the palette every time the bar is drawn.
set -gF status-style "bg=#{@xcl_bar_bg},fg=#{@xcl_bar_fg}"
# Session name == repo, so it belongs in the bar: which project am I in.
set -g status-left "#[bg=#{@xcl_accent_bg},fg=#{@xcl_accent_fg},bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#{@xcl_muted}]#{session_windows} tabs · #{server_sessions} repos "
set -g window-status-separator ""
set -g window-status-format " #{?#{==:#{window_id},#{@xcl_git}},,#I }#W "
set -g window-status-current-format "#[bg=#{@xcl_tab_bg},fg=#{@xcl_accent_fg},bold] #{?#{==:#{window_id},#{@xcl_git}},,#I }#W "

# ------------------------------------------------------------ new tabs
# Prefix binds (C-b by default) — these always work.
#
# The session is passed explicitly so a tab always lands in the repo
# workspace it was launched from.
bind c run-shell -b "xcl-tab claude '#{pane_current_path}' '#{session_name}'"
bind C run-shell -b "xcl-tab codex  '#{pane_current_path}' '#{session_name}'"
bind S run-shell -b "xcl-tab shell  '#{pane_current_path}' '#{session_name}'"
unbind g                      # remove the old lazygit binding on reload
unbind 0                      # git uses Alt-g, not a numerical hotkey
# Resume: each agent's own picker runs inside the tab. No popup, no fzf.
bind r run-shell -b "xcl-tab claude-resume '#{pane_current_path}' '#{session_name}'"
bind R run-shell -b "xcl-tab codex-resume  '#{pane_current_path}' '#{session_name}'"

# Open the repo in an editor. No tab: this hands off to a GUI app and
# returns. Falls back to the current tab's directory if the session has no
# recorded root (a session not created by xcl). Editor choice, including
# XCL_EDITOR, is xcl-open's job — a ${VAR:-default} here would be parsed by
# tmux and break the whole file.
bind z run-shell -b "xcl-open '#{?#{@xcl_root},#{@xcl_root},#{pane_current_path}}'"

# Theme picker. The client is passed so xcl-theme can show its menu there.
bind T run-shell -b "xcl-theme menu '#{client_name}'"

# Drop the stock `prefix w` (choose-tree). `prefix s` still gives a session
# picker for hopping between repos.
unbind w

# ------------------------------------------------- no-prefix tab controls
# Browser-style. Needs the terminal to send Option/Alt as Alt — in Ghostty on
# macOS that is `macos-option-as-alt = true`. If these do nothing, the prefix
# binds above still work.
bind -n M-t run-shell -b "xcl-tab claude '#{pane_current_path}' '#{session_name}'"
# lazygit is the leftmost, unnumbered tab: open it or switch to it.
bind -n M-g run-shell -b "xcl-tab lazygit '#{pane_current_path}' '#{session_name}'"
bind -n M-w confirm-before -p "close tab #W? (y/n)" kill-window
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Reload this file into the running server. The path comes from @xcl_conf,
# which xcl records at session-creation time, and the socket from tmux's own
# #{socket_path} — so no shell-variable syntax, which tmux would try to
# expand itself and fail on.
bind M-r run-shell -b "tmux -S '#{socket_path}' source-file '#{@xcl_conf}' \; display-message 'xcl config reloaded'"
