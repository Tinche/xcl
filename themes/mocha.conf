# Catppuccin Mocha — the default xcl theme.
#
# A theme sets only these palette options; tmux.conf decides where each one
# is used. Copy this file under a new name to make your own.
set -g @xcl_bar_bg    "#181825"
set -g @xcl_bar_fg    "#a6adc8"
set -g @xcl_muted     "#6c7086"
set -g @xcl_accent_bg "#585b70"
set -g @xcl_accent_fg "#cdd6f4"
set -g @xcl_tab_bg    "#313244"
